name: Sync stub README/LICENSE from Codeberg

on:
  repository_dispatch:
    types: [sync-stub]
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Codeberg commit SHA to sync from (default: main HEAD)"
        required: false
        type: string
        default: "main"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve source ref
        id: vars
        run: |
          REF="${{ github.event.client_payload.source_commit || inputs.source_commit || 'main' }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch READMEs, LICENSE, and logos from Codeberg
        run: |
          REF="${{ steps.vars.outputs.ref }}"
          BASE="https://codeberg.org/crisconru/schemasjs/raw/commit/$REF"
          if ! curl -fsSL "$BASE/README.md" -o source-README.md 2>/dev/null; then
            BASE="https://codeberg.org/crisconru/schemasjs/raw/branch/$REF"
          fi
          for f in README.md README.es.md README.zh-cn.md LICENSE; do
            curl -fsSL "$BASE/$f" -o "$f" || true
          done
          for logo in schemajs-logo-light.svg schemajs-logo-dark.svg; do
            curl -fsSL "$BASE/logos/$logo" -o "logos/$logo" || true
          done
          cp README.md source-README.md

      - name: Build stub READMEs with banner and local logo
        run: |
          BANNER='> **🏠 This is the publish-only mirror of [SchemasJS](https://codeberg.org/crisconru/schemasjs).**
          >
          > Source code, issues, pull requests, and discussions live on Codeberg. This GitHub repository exists only to publish npm packages via OIDC trusted publishing (which doesn'\''t currently support Codeberg / Woodpecker).

          '

          for LANG in "" ".es" ".zh-cn"; do
            SRC="source-README${LANG}.md"
            DST="README${LANG}.md"
            if [ -f "$SRC" ]; then
              awk '
                /^>/ && !done { stripping=1; next }
                /^$/ && stripping && !done { next }
                { stripping=0; done=1; print }
              ' "$SRC" | \
                sed 's|https://codeberg.org/crisconru/schemasjs/raw/branch/main/logos/|logos/|g' | \
                { printf '%s\n\n' "$BANNER"; cat; } > "$DST"
            fi
          done
          rm -f source-README.md source-README.es.md source-README.zh-cn.md

      - name: Commit and push if changed
        run: |
          git config user.name "Cristobal Contreras Rubio"
          git config user.email "5649085+crisconru@users.noreply.github.com"
          git add README.md README.es.md README.zh-cn.md LICENSE logos/
          if git diff --cached --quiet; then
            echo "Stub already up-to-date with Codeberg."
            exit 0
          fi
          git commit -m "sync: READMEs/LICENSE/logos from Codeberg @ ${{ steps.vars.outputs.ref }}"
          git push origin main
